name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only PyTorch; the tests need no model weights)
        run: uv pip install --torch-backend cpu -e . pytest  # setup-uv already created .venv
      - name: Run tests (geometry, portrait un-rotation, change logic, null test, abstention, appearance)
        run: uv run --no-sync pytest -q
